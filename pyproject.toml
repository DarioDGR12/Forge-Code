[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-code"
version = "0.12.0"
description = "Open-source AI coding agent for the terminal. BYOK, local models, integrated QA."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Forge-Code contributors" }]
keywords = ["cli", "agent", "coding", "byok", "ollama", "llama.cpp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = ["rich>=13.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
forge = "forge_code.cli:main"

[project.urls]
Homepage = "https://github.com/DarioDGR12/Forge-Code"
Issues = "https://github.com/DarioDGR12/Forge-Code/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
